<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Consultorio Dental</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(160deg, #0b2545 0%, #13315c 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #fff; border-radius: 6px; border-top: 3px solid #b08d57; padding: 38px 32px; width: 100%; max-width: 390px; box-shadow: 0 20px 50px rgba(0,0,0,.3); text-align: center; }
        .login-card .icon { width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 50%; background: #0b2545; color: #b08d57; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .login-card h2 { font-family: 'Cormorant Garamond', Georgia, serif; color: #0b2545; margin-bottom: 6px; font-size: 27px; font-weight: 700; }
        .login-card .sub { color: #5b6676; font-size: 13px; margin-bottom: 24px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { font-size: 11.5px; font-weight: 600; color: #0b2545; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
        .input-custom { width: 100%; padding: 12px 14px; border: 1px solid #cfd4db; border-radius: 4px; outline: none; font-size: 14px; transition: border-color .2s, box-shadow .2s; }
        .input-custom:focus { border-color: #13315c; box-shadow: 0 0 0 3px rgba(19,49,92,.12); }
        .btn-login { width: 100%; background: #0b2545; color: #fff; border: none; padding: 13px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 8px; transition: background .2s; }
        .btn-login:hover { background: #13315c; }
        .alert-error { color: #7f1d1d; font-size: 13px; margin-bottom: 18px; background: #fbeeee; border: 1px solid #e8bcbc; border-left: 4px solid #b42323; padding: 10px 12px; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon"><i class="fas fa-user-shield"></i></div>
        <h2>Panel administrador</h2>
        <p class="sub">Acceso exclusivo para personal autorizado</p>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert-error"><i class="fas fa-triangle-exclamation"></i> {{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" class="input-custom" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" class="input-custom" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
    </div>
</body>
</html>
